# Deploy Firestore rules (always) + Cloud Functions (conditional, non-blocking)
# to buildsmart-b0b78. Sibling workflow to firebase-hosting.yml — same branch /
# same service-account secret. The live web build stays demo: this workflow NEVER
# passes USE_FIREBASE_BACKEND or any dart-define (the backend is gated behind a
# default-off flag by the app fleet).
#
# Required IAM roles on the FIREBASE_SERVICE_ACCOUNT (granted in GCP IAM console):
#   • Service Usage Consumer   — API-enablement checks
#   • Firebase Rules Admin     — deploy firestore rules
#   • (Cloud Functions Admin + Service Account User — later, for functions deploy)
name: Deploy Firebase Rules + Functions

on:
  push:
    branches: [ claude/whats-happening-LyY9G ]   # mirrors firebase-hosting.yml
  workflow_dispatch:

# Cancel an in-flight deploy when a newer commit lands on the same ref.
concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # paths-filter needs history to diff against the base

      # ── Detect whether functions/ changed (gates the functions deploy) ──
      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            functions:
              - 'functions/**'

      # ─────────────────────── GATE ───────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true

      - name: Install Flutter deps
        working-directory: app_flutter
        run: flutter pub get

      - name: Generate version.g.dart (gitignored)
        run: bash scripts/gen_version.sh

      - name: Flutter analyze (GATE — errors are fatal)
        working-directory: app_flutter
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter test (GATE)
        working-directory: app_flutter
        run: flutter test --reporter=compact

      - name: Setup Node (for functions build + firebase-tools)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions deps
        working-directory: functions
        run: npm ci

      - name: Functions build (GATE — tsc)
        working-directory: functions
        run: npm run build

      # ────────────────── AUTH (service account) ───────────────────
      - name: Write service-account credentials
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "${RUNNER_TEMP}/gcp-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/gcp-sa.json" >> "$GITHUB_ENV"

      - name: Install firebase-tools
        run: npm i -g firebase-tools

      # The committed firebase.json already declares firestore (rules),
      # functions (source) and hosting — so deploy against it directly from the
      # repo root. (A previous temp --config in $RUNNER_TEMP broke the relative
      # firestore.rules path: firebase resolves rule paths next to the config file.)
      # ─────────────────── DEPLOY: rules (always) ───────────────────
      - name: Deploy Firestore rules
        run: |
          firebase deploy \
            --only firestore:rules \
            --project buildsmart-b0b78 \
            --non-interactive

      # ─────────── DEPLOY: functions (conditional + non-blocking) ───────────
      # Only when functions/ changed. Cloud Functions needs Blaze + extra IAM
      # roles; wrapped in continue-on-error so it NEVER blocks (rules already
      # deployed above).
      - name: Deploy Cloud Functions (Blaze-gated, non-blocking)
        if: steps.changes.outputs.functions == 'true'
        continue-on-error: true
        run: |
          echo "⚠️ functions deploy needs Blaze + IAM roles — attempting (non-blocking)."
          firebase deploy \
            --only functions \
            --project buildsmart-b0b78 \
            --non-interactive
          echo "ℹ️ if the above failed, rules are already deployed — functions can follow once Blaze + roles are set."

      - name: Note when functions deploy is skipped (no functions/ change)
        if: steps.changes.outputs.functions != 'true'
        run: echo "ℹ️ functions/ unchanged in this push — skipping functions deploy (rules deployed)."
