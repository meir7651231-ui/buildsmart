# Deploy Firestore rules (always) + Cloud Functions (conditional, non-blocking)
# to buildsmart-b0b78. Sibling workflow to firebase-hosting.yml. The live web
# build stays demo: this workflow NEVER passes USE_FIREBASE_BACKEND.
#
# Required IAM roles on FIREBASE_SERVICE_ACCOUNT: Service Usage Consumer,
# Firebase Rules Admin, Cloud Functions Admin, Service Account User,
# Secret Manager Admin, Project IAM Admin (last one removable after first deploy).
# Required APIs: cloudfunctions, cloudbuild, artifactregistry, secretmanager,
# pubsub, storage, run, eventarc, cloudbilling.
# GitHub secrets: FIREBASE_SERVICE_ACCOUNT, R2_ACCESS_KEY_ID,
# R2_SECRET_ACCESS_KEY, R2_ACCOUNT_ID.
name: Deploy Firebase Rules + Functions

on:
  push:
    branches: [ claude/whats-happening-LyY9G ]
  workflow_dispatch:

concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            functions:
              - 'functions/**'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true

      - name: Install Flutter deps
        working-directory: app_flutter
        run: flutter pub get

      - name: Generate version.g.dart (gitignored)
        run: bash scripts/gen_version.sh

      - name: Flutter analyze (GATE — errors are fatal)
        working-directory: app_flutter
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter test (GATE)
        working-directory: app_flutter
        run: flutter test --reporter=compact

      - name: Setup Node (for functions build + firebase-tools)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions deps
        working-directory: functions
        run: npm ci

      - name: Functions build (GATE — tsc)
        working-directory: functions
        run: npm run build

      - name: Write service-account credentials
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "${RUNNER_TEMP}/gcp-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/gcp-sa.json" >> "$GITHUB_ENV"

      - name: Install firebase-tools
        run: npm i -g firebase-tools

      - name: Deploy Firestore rules + indexes
        run: |
          firebase deploy \
            --only firestore:rules,firestore:indexes \
            --project buildsmart-b0b78 \
            --non-interactive

      # Inject R2 config (secrets → Secret Manager; params → functions/.env.<project>).
      - name: Provision R2 config for functions
        if: steps.changes.outputs.functions == 'true'
        run: |
          printf '%s' '${{ secrets.R2_ACCESS_KEY_ID }}' \
            | firebase functions:secrets:set R2_ACCESS_KEY_ID --project buildsmart-b0b78 --data-file -
          printf '%s' '${{ secrets.R2_SECRET_ACCESS_KEY }}' \
            | firebase functions:secrets:set R2_SECRET_ACCESS_KEY --project buildsmart-b0b78 --data-file -
          {
            printf 'R2_ACCOUNT_ID=%s\n' '${{ secrets.R2_ACCOUNT_ID }}'
            printf 'R2_BUCKET=%s\n' 'buildsmart-images'
          } > functions/.env.buildsmart-b0b78

      # --force: auto-set the Artifact Registry cleanup policy (otherwise the
      # deploy exits non-zero on the first 2nd-gen deploy even after success).
      - name: Deploy Cloud Functions (Blaze-gated, non-blocking)
        if: steps.changes.outputs.functions == 'true'
        continue-on-error: true
        run: |
          echo "Deploying Cloud Functions to buildsmart-b0b78..."
          firebase deploy \
            --only functions \
            --project buildsmart-b0b78 \
            --non-interactive \
            --force

      - name: Note when functions deploy is skipped (no functions/ change)
        if: steps.changes.outputs.functions != 'true'
        run: echo "functions/ unchanged in this push — skipping functions deploy (rules deployed)."
