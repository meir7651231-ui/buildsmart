name: Deploy Flutter Web to Firebase Hosting

on:
  push:
    branches: [ claude/whats-happening-LyY9G ]
  workflow_dispatch:

concurrency:
  group: firebase-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true

      - name: Install Flutter deps
        working-directory: app_flutter
        run: flutter pub get

      - name: Generate version.g.dart (gitignored)
        run: bash scripts/gen_version.sh

      - name: Build Flutter web (root base-href for custom domain)
        working-directory: app_flutter
        run: flutter build web --release --base-href "/"

      - name: Deploy to Firebase Hosting (live channel)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: buildsmart-b0b78
          channelId: live
