name: Deploy Flutter Web to Firebase Hosting

on:
  push:
    branches: [ claude/whats-happening-LyY9G ]
  workflow_dispatch:

concurrency:
  group: firebase-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true

      - name: Install Flutter deps
        working-directory: app_flutter
        run: flutter pub get

      - name: Generate version.g.dart (gitignored)
        run: bash scripts/gen_version.sh

      - name: Build Flutter web (root base-href for custom domain)
        working-directory: app_flutter
        # --dart-define=ENABLE_WORD_FINDER=true turns ON the 'מאתר חכם' word-finder
        # for the buildsmart-il.com demo build ONLY (OWNER-REVIEW). Scoped here, so
        # the app / Android / preview builds stay default-off. Reversible: remove
        # the flag to hide the word-finder again.
        # --dart-define=KB_LIVE_MIRROR=true turns ON the live-mirror keyboard: the
        # prediction row + tools mirror the current tab/drill across all 4 tabs
        # (קטלוג/מחלקות/עדכונים/חנות). OWNER-REQUESTED live (22/6). Reversible:
        # remove the flag to fall back to byte-identical (the mirror tree-shakes).
        run: flutter build web --release --base-href "/" --dart-define=ENABLE_WORD_FINDER=true --dart-define=KB_LIVE_MIRROR=true

      - name: Deploy to Firebase Hosting (live channel)
        # Redundant with web-deploy.yml (firebase-tools CLI), which already deploys
        # this same live site and is idempotent. A byte-identical rebuild yields the
        # same version hash → this action returns 400 "version already active" (a
        # harmless no-op re-deploy). Non-blocking so the redundant duplicate can't
        # red the branch; the real live deploy is covered by web-deploy.yml (a real
        # deploy change still produces a new hash and deploys normally).
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: buildsmart-b0b78
          channelId: live
