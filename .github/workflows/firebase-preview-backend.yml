# Preview build of the Flutter web app with the REAL Firebase backend enabled
# (USE_FIREBASE_BACKEND=true), deployed to a temporary Hosting preview channel.
# The main live site (firebase-hosting.yml) stays on the demo/_local data — this
# is an isolated test URL so a backend bug never breaks buildsmart-il.com.
name: Preview — Web with real Firebase backend

on:
  push:
    branches: [ claude/whats-happening-LyY9G ]
  workflow_dispatch:

concurrency:
  group: firebase-preview-backend
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true

      - name: Install Flutter deps
        working-directory: app_flutter
        run: flutter pub get

      - name: Generate version.g.dart (gitignored)
        run: bash scripts/gen_version.sh

      # Match the phone test build (android-test-build.yml) EXACTLY: the orders
      # read rule is per-document (ownsOrder / storeUid==uid / pool), so a
      # contractor's whole-collection listen (UID_SCOPED_QUERIES OFF) is denied
      # by Firestore — the synced order would never appear. UID_SCOPED_QUERIES=true
      # makes the query `contractorUid == uid`, which the rules prove → sync shows.
      # SERVER_CALLABLES=true keeps parity with the phone (stage-advance/setRole).
      # FS_DIAG=true mounts the on-screen backend badge (🟢 server/🔴 demo + uid +
      # a 4-step Firestore self-test) so a tester can SEE both devices are on the
      # same server + same uid — the thing that must match for cross-device sync.
      - name: Build Flutter web (REAL backend + uid-scoped queries + callables + diag)
        working-directory: app_flutter
        run: >-
          flutter build web --release
          --dart-define=USE_FIREBASE_BACKEND=true
          --dart-define=UID_SCOPED_QUERIES=true
          --dart-define=SERVER_CALLABLES=true
          --dart-define=FS_DIAG=true

      - name: Deploy to Hosting preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: buildsmart-b0b78
          channelId: backend-preview
          expires: 30d
