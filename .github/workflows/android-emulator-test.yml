name: Android emulator — keyboard smoke + BACK (real AVD)

# Runs the KB_GLOBAL floating keyboard on a REAL Android emulator in the cloud
# (local emulation is impossible on the dev box — no hardware virtualization).
# The integration test proves, on genuine Android: (1) the keyboard RENDERS,
# (2) the OS BACK closes it instead of exiting the app (the audit's didPopRoute
# fix, confirmed on-device). A GREEN run = both hold on real Android. Trigger
# manually (Run workflow) or on integration-test / workflow changes.

on:
  workflow_dispatch:
  push:
    branches: [claude/whats-happening-LyY9G]
    paths:
      - 'app_flutter/integration_test/**'
      - 'app_flutter/test_driver/**'
      - '.github/workflows/android-emulator-test.yml'

permissions:
  contents: read

jobs:
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter deps
        working-directory: app_flutter
        run: flutter pub get

      # KVM hardware acceleration — GitHub's ubuntu runners expose nested virt,
      # so the x86_64 AVD boots fast (the exact thing the dev laptop cannot do).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run keyboard test on a real Android emulator (API 30)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 30 (Android 11) x86_64 aosp — the reliable CI combo. The prior
          # API 34 image spent 102s failing to boot on the runner (heavy image);
          # 30 boots fast + still exercises real Android for the render + BACK.
          api-level: 30
          arch: x86_64
          target: default
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none -memory 2048
          script: |
            cd app_flutter
            set +e
            # flutter drive targets ONE integration test on the device — avoids
            # `flutter test`'s "integration + unit cannot run in one invocation".
            # The driver just waits (no screenshot), so it runs clean on the AVD.
            flutter drive \
              --driver=test_driver/integration_test.dart \
              --target=integration_test/keyboard_android_test.dart \
              --dart-define=KB_GLOBAL=true \
              --dart-define=KB_LIVE_MIRROR=true \
              --dart-define=ENABLE_WORD_FINDER=true 2>&1 | tee /tmp/ft.log
            code=${PIPESTATUS[0]}
            [ "$code" -eq 0 ] || tail -30 /tmp/ft.log | while IFS= read -r l; do echo "::error::$l"; done
            exit $code
