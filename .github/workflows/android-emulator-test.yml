name: Android emulator — keyboard smoke + BACK (real AVD)

# Runs the KB_GLOBAL floating keyboard on a REAL Android emulator in the cloud
# (local emulation is impossible on the dev box — no hardware virtualization).
# Proves on genuine Android: (1) the keyboard RENDERS (uploads a screenshot),
# (2) the OS BACK closes it instead of exiting the app (the audit's didPopRoute
# fix, confirmed on-device). Trigger manually (Run workflow) or on integration
# test / driver / workflow changes.

on:
  workflow_dispatch:
  push:
    branches: [claude/whats-happening-LyY9G]
    paths:
      - 'app_flutter/integration_test/**'
      - 'app_flutter/test_driver/**'
      - '.github/workflows/android-emulator-test.yml'

permissions:
  contents: read

jobs:
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter deps
        working-directory: app_flutter
        run: flutter pub get

      # KVM hardware acceleration — GitHub's ubuntu runners expose nested virt,
      # so the x86_64 AVD boots fast (the exact thing the dev laptop cannot do).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run keyboard test on a real Android emulator (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          script: |
            cd app_flutter
            flutter drive \
              --driver=test_driver/integration_test.dart \
              --target=integration_test/keyboard_android_test.dart \
              --dart-define=KB_GLOBAL=true \
              --dart-define=KB_LIVE_MIRROR=true \
              --dart-define=ENABLE_WORD_FINDER=true

      - name: Upload the on-device keyboard screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-keyboard-screenshot
          path: app_flutter/screenshots/**
          if-no-files-found: warn
