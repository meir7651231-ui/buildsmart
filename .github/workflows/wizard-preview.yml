# GIANT Phase-2 · wizard-preview — a LIVE preview of the runtime OrgConfig
# setup wizard (giant-system V5 · "🔌 אשף הקמת חברה"), ARMED with
# ORG_CONFIG=true on the CLEAN empty-shell profile (zero demo content — you see
# a company set itself up from nothing). The wizard entry chain is NOT
# clean-gated (manager persona is modOn(manager)=on by default; the wizard card
# rides kOrgConfigFlag, not the profile), so ORG_CONFIG=true surfaces it on
# clean with no code change. Deploys to the SEPARATE `wizard` Firebase Hosting
# channel — the live site is untouched. Prints the live link in the run summary.
name: wizard-preview

on:
  workflow_dispatch:
  push:
    branches:
      - claude/whats-happening-LyY9G
    paths:
      - '.github/workflows/wizard-preview.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Pub get
        working-directory: app_flutter
        run: flutter pub get

      - name: Gen version
        run: bash scripts/gen_version.sh

      - name: Build (clean empty-shell · ORG_CONFIG armed)
        working-directory: app_flutter
        run: >
          flutter build web --release --base-href "/"
          --dart-define=APP_PROFILE=clean
          --dart-define=ORG_CONFIG=true

      - name: Deploy to channel `wizard`
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: buildsmart-b0b78
          channelId: wizard

      - name: Link in run summary
        run: |
          echo "## 🔌 אשף הקמת חברה — live preview (clean empty-shell)" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.details_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "מנהל → טאב ניהול → כרטיס '🔌 אשף הקמת חברה' → ורטיקל · מודולים · רכיבים · שמור והפעל." >> "$GITHUB_STEP_SUMMARY"
