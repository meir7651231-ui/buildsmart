name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/whats-happening-LyY9G
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ─── Preact app (live at /buildsmart/) ──────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Preact deps
        working-directory: app
        run: npm ci

      - name: Build Preact app
        working-directory: app
        run: npm run build
        env:
          GITHUB_PAGES: '1'

      # ─── Flutter app (preview at /buildsmart/flutter/) ──────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true

      - name: Install Flutter deps
        working-directory: app_flutter
        run: flutter pub get

      - name: Generate version.g.dart (gitignored — לקח #72)
        run: bash scripts/gen_version.sh

      - name: Flutter analyze (GATE — blocks build on any error)
        working-directory: app_flutter
        # Errors are fatal; pre-existing lint infos/warnings (avoid_print etc.
        # in test files) must NOT block the deploy — that froze the live site.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter test (GATE — blocks build on any failure)
        working-directory: app_flutter
        run: flutter test --reporter=compact

      # ── K5: CONTENT GATES before shipping. v3 deployed to prod with ZERO
      #    content gates — a dark surface / secret / RTL violation could ship even
      #    if protocol-enforce.yml was bypassed. We now run the content engine over
      #    the WHOLE resulting tree as a REQUIRED step before gh-pages/APK publish.
      #    RC captured explicitly (set +e) so crash ≠ finding; ERR-level findings
      #    (rc 2) block the deploy, a crash (other rc) also blocks (fail closed).
      - name: K5 — content engine over the whole tree (REQUIRED pre-ship gate)
        working-directory: app_flutter
        run: |
          set -euo pipefail
          git --no-replace-objects ls-tree -r --name-only HEAD > /tmp/tree_all.txt
          sed 's#^app_flutter/##' /tmp/tree_all.txt > /dev/null || true
          set +e
          dart run tool/protocol_check.dart \
            --tree \
            --names /tmp/tree_all.txt \
            --show "git --no-replace-objects show HEAD:" \
            --stuck-log knowledge/stuck_log.md
          TREE_RC=$?
          set -e
          if [[ "$TREE_RC" -eq 2 ]]; then
            echo "::error::K5 content engine found ERR-level findings — NOT shipping"; exit 1
          fi
          if [[ "$TREE_RC" -ne 0 ]]; then
            echo "::error::K5 content engine crashed (rc=$TREE_RC) — fail closed, NOT shipping"; exit 1
          fi
          echo "✅ K5 content engine clean — safe to ship"

      - name: Build Flutter web
        working-directory: app_flutter
        run: flutter build web --release --base-href "/buildsmart/flutter/"

      - name: Stage Flutter under /flutter/
        run: |
          mkdir -p app/dist/flutter
          cp -r app_flutter/build/web/* app/dist/flutter/

      # ─── Publish combined output FIRST ──────────────────────────
      # The web deploy must NOT depend on the (fragile, Android-toolchain)
      # APK build below — otherwise an APK failure freezes the live site.
      - name: Push to gh-pages
        run: |
          cd app/dist
          touch .nojekyll
          git init -q
          git config user.email "bot@buildsmart"
          git config user.name "BuildSmart CI"
          git checkout -q -b gh-pages
          git add -A
          git commit -q -m "deploy: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      # ─── APK (offline Android) — best-effort, never blocks deploy ─
      - name: Setup Java (required for Android build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Android APK
        working-directory: app_flutter
        continue-on-error: true
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: buildsmart-apk
          path: app_flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30
