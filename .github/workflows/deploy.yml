name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/whats-happening-LyY9G
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ─── Preact app (live at /buildsmart/) ──────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Preact deps
        working-directory: app
        run: npm ci

      - name: Build Preact app
        working-directory: app
        run: npm run build
        env:
          GITHUB_PAGES: '1'

      # ─── Flutter app (preview at /buildsmart/flutter/) ──────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.3'   # DX6 (v7): the REAL installable SDK (local==CI==ship)
          cache: true

      - name: Install Flutter deps
        working-directory: app_flutter
        run: flutter pub get

      - name: Generate version.g.dart (gitignored — לקח #72)
        run: bash scripts/gen_version.sh

      - name: Flutter analyze (GATE — blocks build on any error)
        working-directory: app_flutter
        # Errors are fatal; pre-existing lint infos/warnings (avoid_print etc.
        # in test files) must NOT block the deploy — that froze the live site.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter test (GATE — blocks build on any failure)
        working-directory: app_flutter
        run: flutter test --reporter=compact

      # ── S4 (v5): K5 now runs the TRUSTED engine over the WHOLE REPO-ROOT tree ──
      # v4's K5 ran the PR's OWN (untrusted) tool/protocol_check.dart from the
      # app_flutter CWD, so (a) a stubbed PR engine shipped itself, and (b) the
      # `ls-tree` only saw app_flutter/* paths (the engine's path scoping then
      # missed `.github/`, `app/`, root `index.html`). v5:
      #   * fetches the engine + registry from origin/main (the TRUSTED ref, same
      #     as protocol-enforce K2) so the PR cannot judge itself with a stub;
      #   * runs `ls-tree` from the REPO ROOT (like K1) and feeds repo-root-relative
      #     names, so EVERY tracked file is scanned (incl. .github/, app/, index.html).
      - name: S4 — fetch the TRUSTED engine/registry from origin/main
        id: trusted
        env:
          BOOTSTRAP_VAR: ${{ vars.BOOTSTRAP }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main >/dev/null 2>&1 || echo "::warning::could not fetch origin/main"
          mkdir -p .trusted/tool .trusted/protocol
          fetched_all=1
          pull() { # <repo-path> <dest>
            if git --no-replace-objects cat-file -e "origin/main:$1" 2>/dev/null; then
              git --no-replace-objects show "origin/main:$1" > "$2"; echo "  trusted: $1"
            else
              echo "::warning::origin/main lacks $1 — BOOTSTRAP fallback to PR copy"
              if [[ -f "$1" ]]; then cp "$1" "$2"; else echo "::error::$1 missing in PR too"; exit 1; fi
              fetched_all=0
            fi
          }
          pull app_flutter/tool/protocol_check.dart          .trusted/tool/protocol_check.dart
          pull app_flutter/tool/protocol_check_selftest.dart .trusted/tool/protocol_check_selftest.dart
          pull protocol/gates.tsv                             .trusted/protocol/gates.tsv
          # S1-parity: fail closed if the trusted fetch is incomplete and this is
          # not an explicitly-marked bootstrap — do NOT ship judged by a PR stub.
          if [[ "$fetched_all" != "1" && "${BOOTSTRAP_VAR:-}" != "1" ]]; then
            echo "::error::S4 fail-closed — origin/main missing a protocol file and BOOTSTRAP unset; refusing to ship judged by the PR's own engine."
            exit 1
          fi

      - name: K5/S4 — TRUSTED content engine over the WHOLE repo-root tree (pre-ship)
        run: |
          set -euo pipefail
          TRUSTED="$GITHUB_WORKSPACE/.trusted/tool/protocol_check.dart"
          # Repo-ROOT tree (like K1) — every tracked file, not just app_flutter/*.
          # H1 (v6): quotePath=false so a non-ASCII (Hebrew) filename is its TRUE
          # path, not a C-quoted string the engine could not fetch → silent skip.
          git -c core.quotePath=false --no-replace-objects ls-tree -r --name-only HEAD > /tmp/tree_all.txt
          # V10-B — ls-tree WITH mode (drop --name-only) so the engine can SEE
          # 120000 (symlink) / 160000 (gitlink) entries and fail closed on the
          # whole-tree-scan SKIP class (submodule/symlink/LFS) before shipping.
          git -c core.quotePath=false --no-replace-objects ls-tree -r HEAD > /tmp/tree_entries.txt
          echo "── tree size ──"; wc -l /tmp/tree_all.txt
          set +e
          dart run "$TRUSTED" \
            --tree \
            --tree-entries /tmp/tree_entries.txt \
            --show "git --no-replace-objects show HEAD:" \
            --stuck-log app_flutter/knowledge/stuck_log.md | tee /tmp/tree_out.txt
          TREE_RC=${PIPESTATUS[0]}
          set -e
          # H3 (v6): rc 3 == fed-vs-scanned reconciliation fail (silent-skip class).
          if [[ "$TREE_RC" -eq 3 ]]; then
            echo "::error::K5/H3 reconciliation FAILED — a tracked file FED but NOT scanned; NOT shipping. Engine output:"
            grep -E 'H3 reconciliation|unscanned' /tmp/tree_out.txt || true
            exit 1
          fi
          if [[ "$TREE_RC" -eq 2 ]]; then
            echo "::error::K5 content engine found ERR-level findings — NOT shipping"; exit 1
          fi
          if [[ "$TREE_RC" -ne 0 ]]; then
            echo "::error::K5 content engine crashed (rc=$TREE_RC) — fail closed, NOT shipping"; exit 1
          fi
          # H3 belt: the reconciliation OK line must be present (fed==scanned).
          if ! grep -qE '^OK\treg\tH3 reconciliation: fed==scanned==[0-9]+' /tmp/tree_out.txt; then
            echo "::error::K5/H3 reconciliation line ABSENT — engine did not confirm fed==scanned; NOT shipping"; exit 1
          fi
          echo "✅ K5/S4 trusted content engine clean over the WHOLE repo-root tree — safe to ship (H3 OK)"

      - name: Build Flutter web
        working-directory: app_flutter
        run: flutter build web --release --base-href "/buildsmart/flutter/"

      - name: Stage Flutter under /flutter/
        run: |
          mkdir -p app/dist/flutter
          cp -r app_flutter/build/web/* app/dist/flutter/

      # ─── Publish combined output FIRST ──────────────────────────
      # The web deploy must NOT depend on the (fragile, Android-toolchain)
      # APK build below — otherwise an APK failure freezes the live site.
      - name: Push to gh-pages
        run: |
          cd app/dist
          touch .nojekyll
          git init -q
          git config user.email "bot@buildsmart"
          git config user.name "BuildSmart CI"
          git checkout -q -b gh-pages
          git add -A
          git commit -q -m "deploy: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      # ─── APK (offline Android) — best-effort, never blocks deploy ─
      - name: Setup Java (required for Android build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Android APK
        working-directory: app_flutter
        continue-on-error: true
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: buildsmart-apk
          path: app_flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30
