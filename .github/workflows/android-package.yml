name: Android package (APK + AAB for Play)

# Builds the Google-Play bundle (AAB) + an installable APK on a Linux runner
# (avoids the local Windows Gradle hang). Artifacts are downloadable from the
# run page. Runs on demand (workflow_dispatch) or when app_flutter changes.
#
# NOTE: until a real release keystore is wired (android/key.properties from a
# CI secret), the release build is DEBUG-SIGNED — great for testing/installing,
# but NOT accepted by Google Play. See app_flutter/LAUNCH_PACKAGE/SEND_TO_GOOGLE.md.

on:
  workflow_dispatch:
  push:
    branches: [claude/whats-happening-LyY9G]
    paths:
      - 'app_flutter/**'
      - '.github/workflows/android-package.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up release signing (if keystore secret present)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        working-directory: app_flutter
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/upload-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' "$KS_PW" "$KS_PW" "$KS_ALIAS" > android/key.properties
            echo "✅ release signing configured (Play-ready AAB)"
          else
            echo "⚠️ no ANDROID_KEYSTORE_BASE64 secret — release will be debug-signed (NOT Play-ready)"
          fi

      - name: Flutter deps
        working-directory: app_flutter
        run: flutter pub get

      - name: Analyze (GATE — 0 errors required)
        working-directory: app_flutter
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test (GATE — all green required)
        working-directory: app_flutter
        run: flutter test --reporter=compact

      - name: Build AAB (Google Play app bundle)
        working-directory: app_flutter
        run: flutter build appbundle --release

      - name: Build APK (installable on a device)
        working-directory: app_flutter
        run: flutter build apk --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app_flutter/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app_flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
