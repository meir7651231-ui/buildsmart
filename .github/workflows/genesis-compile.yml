name: genesis-compile

# שער-הקומפילציה של המחולל: מריץ flutter analyze על 83 אטומי-המוֹשֶׁן
# שנוצרו ב--ai-chat-server והוזרקו לכאן. ירוק = אפס שגיאות-קומפילציה.
on:
  push:
    branches: ['claude/**']
    paths:
      - 'app_flutter/lib/genesis/**'
      - '.github/workflows/genesis-compile.yml'
  workflow_dispatch:

jobs:
  analyze-atoms:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter version
        run: flutter --version
      - name: Pub get
        run: flutter pub get
      - name: Analyze genesis atoms
        run: flutter analyze lib/genesis
