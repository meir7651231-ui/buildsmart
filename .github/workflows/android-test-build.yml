name: Android TEST build (backend flags ON — connects to Firebase)

# SEPARATE from the live android-package.yml (which stays DEMO, never passes the
# backend flags). This is a workflow_dispatch-only build with the backend flags
# ON, for on-device verification that the app connects to the live Firebase
# backend after F1. The APK is downloadable from the run's artifacts.
#
# DEBUG-SIGNED on purpose (self-install / sideload) — NOT a Play release. The
# live web build (deploy.yml / firebase-hosting.yml) is unaffected and stays demo.

on:
  workflow_dispatch:
  push:
    branches: [ claude/whats-happening-LyY9G ]
    paths:
      - 'app_flutter/**'
      - '.github/workflows/android-test-build.yml'

permissions:
  contents: read

jobs:
  android-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use the committed stable test key for release signing (key.properties)
        run: |
          mkdir -p ~/.android
          cp app_flutter/android/app/bs-test-debug.keystore ~/.android/debug.keystore
          printf 'storePassword=android\nkeyPassword=android\nkeyAlias=androiddebugkey\nstoreFile=bs-test-debug.keystore\n' > app_flutter/android/key.properties
          echo "✅ key.properties -> app/bs-test-debug.keystore (SHA-1 68:F9:...:57:68:52) so Google sign-in works"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter deps
        working-directory: app_flutter
        run: flutter pub get

      - name: Generate version.g.dart (gitignored — לקח #72)
        run: bash scripts/gen_version.sh

      - name: Analyze (GATE — 0 errors required)
        working-directory: app_flutter
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK with backend flags ON (debug-signed, connects to server)
        working-directory: app_flutter
        run: |
          # --build-number = CI run number → a UNIQUE, monotonically rising Android
          # versionCode on every build. Without it the versionCode stays pinned at
          # pubspec's +N, so App Distribution / Android saw every build as the SAME
          # version "1.4.x (8)" and never offered the update (the v6.20 delivery bug).
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=USE_FIREBASE_BACKEND=true \
            --dart-define=UID_SCOPED_QUERIES=true \
            --dart-define=SERVER_CALLABLES=true \
            --dart-define=CLAUDE_AI=true \
            --dart-define=ENABLE_WORD_FINDER=true

      - name: Upload backend-ON APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-backend-on-apk
          path: app_flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # ── Firebase App Distribution — THIS (flags-ON, real backend) is the build
      #    the tester auto-updates to: install once, then every push pings the
      #    device. It is the ONLY build whose live features (🟢/🔴 connection ·
      #    ✓✓/❌ delivery) actually exercise the server. Same SA→ADC pattern as
      #    bootstrap-admin.yml; continue-on-error so a transient distribute hiccup
      #    never fails the build (the artifact is the fallback). The SA needs the
      #    "Firebase App Distribution Admin" role.
      - name: Write service account credentials
        run: printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Distribute to Firebase App Distribution
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          echo "── deploy SA (needs 'Firebase App Distribution Admin'):"
          grep -oE '"client_email"[^,]+' "$GOOGLE_APPLICATION_CREDENTIALS" || true
          npm install -g firebase-tools >/dev/null 2>&1
          firebase appdistribution:distribute \
            app_flutter/build/app/outputs/flutter-apk/app-release.apk \
            --app "1:483064122180:android:e9d240f3251e7a33ca6511" \
            --testers "meir7651231@gmail.com" \
            --release-notes "🟢 v6.65 — ליטוש (אודיט-נחיל גל-2): אבטחת-עלות בשרת (model-allowlist) + a11y button-role בקטלוג · אפס שינוי-תצוגה · v6.65 במסך הבית · build #${{ github.run_number }}" \
            --project buildsmart-b0b78
