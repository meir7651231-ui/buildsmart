name: "💡 Idea · הצעה"
description: Suggest an improvement · הצעה לשיפור
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        New features are frozen until the store launch (see ROADMAP.md). Ideas are welcome and will be reviewed after launch.
        פיצ'רים חדשים מוקפאים עד ההשקה (ראו ROADMAP.md). הצעות יתקבלו וייבחנו אחרי ההשקה.
  - type: textarea
    id: problem
    attributes:
      label: The problem · הבעיה
      description: Who has it and when — contractor, manager, store, courier or worker? · למי ומתי?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea · ההצעה
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How it's done today · איך עושים את זה היום
