<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <base href="/buildsmart/kehila/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7A6BF0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kehila">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <title>Kehila</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { background: #0C0C0E; }
    #splash { position: fixed; inset: 0; z-index: 2147483647; display: flex; align-items: center; justify-content: center; background: #0C0C0E; transition: opacity .3s ease; }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash .in { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    #splash .mark { width: 76px; height: 76px; border-radius: 20px; background: #7A6BF0; display: flex; align-items: center; justify-content: center; font-size: 40px; }
    #splash .nm { font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; font-size: 20px; font-weight: 700; color: #7A6BF0; }
  </style>
</head>
<body>
  <div id="splash"><div class="in"><div class="mark">K</div><div class="nm">Kehila</div></div></div>
  <script>
    (function () {
      var s = document.getElementById('splash');
      function hide() { if (!s) return; s.classList.add('hidden'); var e = s; s = null; setTimeout(function () { if (e && e.parentNode) e.parentNode.removeChild(e); }, 400); }
      window.addEventListener('flutter-first-frame', hide);
      setTimeout(hide, 12000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
