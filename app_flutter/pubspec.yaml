name: buildsmart
description: "BuildSmart — construction site procurement & task management"
publish_to: 'none'
version: 1.4.2+8

environment:
  sdk: ^3.7.2

dependencies:
  # REAL webcam capture on web (#85ב/#85ד) — getUserMedia preview + shutter
  # for the proof/profile photo (screens/webcam_capture_sheet.dart); the same
  # browser permission flow the barcode scanner already uses.
  camera: ^0.11.0
  camera_web: ^0.3.5

  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # state management — closest spirit to @preact/signals
  flutter_riverpod: ^2.6.1

  # i18n — לא בשימוש ישיר; `any` נפתר על שני ה-SDK pins (0.19 ב-3.29 / 0.20 ב-3.44)
  intl: any

  # cloud product images (Cloudflare R2) — keeps the AAB light (−52%); LRU-bounded
  # on-device cache. lib/data/product_images.dart is the single resolver.
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1

  # proof-photo capture (#85ב) + profile photo (#85ד) — camera on mobile;
  # on web the FALLBACK file picker behind the real webcam capture
  # (camera/camera_web via screens/webcam_capture_sheet.dart)
  image_picker: ^1.1.2

  # native barcode scanner — iOS/Android + Web (limited)
  mobile_scanner: ^5.2.3

  # microphone permission (used by speech_to_text)
  permission_handler: ^11.3.1

  # native/web share sheet — cart 'שתף' (falls back to the Web Share API on web)
  share_plus: ^10.0.0

  # real PDF generation + print/share — the finance-hub "הפק והורד דוח PDF"
  # report. `printing` works on iOS/Android/Web (Web prints/downloads via the
  # browser); `pdf` builds the document.
  printing: ^5.13.0
  pdf: ^3.11.0

  # launch the native dialer (tel:) + WhatsApp (https://wa.me/…) from the
  # contact/chat 📞/💬 buttons — no in-app calling, just hand off to the OS.
  url_launcher: ^6.3.0

  # persistence (settings + profile)
  shared_preferences: ^2.3.4

  # native speech-to-text — iOS/Android (Web falls back to Web Speech)
  speech_to_text: ^7.0.0

  # browser canvas downscale/JPEG re-encode for web captures
  # (services/photo_downscale.dart — keeps data-URLs inside the persist budget)
  web: ^1.1.0
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  firebase_messaging: ^16.3.0
  cloud_functions: ^6.3.2
  firebase_app_check: ^0.4.4+2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # strictest analyzer preset
  very_good_analysis: ^7.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Product/page photos load from Cloudflare R2 at runtime + on-device cache
    # (lib/data/product_images.dart) — only category icons + fonts stay bundled,
    # so the app ships light (#3 weight; full image quality preserved on the CDN).
    - assets/lipskey/categories/
    - assets/fonts/

  fonts:
    - family: Heebo
      fonts:
        - asset: assets/fonts/Heebo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Heebo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Heebo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Heebo-ExtraBold.ttf
          weight: 800
